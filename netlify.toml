[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["@google/genai"]

[dev]
  command = "npm run dev"
  targetPort = 3000
  port = 3001

[context.production]
  [[context.production.redirects]]
    from = "/*"
    to = "/index.html"
    status = 200
